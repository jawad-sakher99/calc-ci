name: CI
on: push
jobs:
    test:
        needs: lint
        runs-on: ubuntu-latest
        steps: 
           - uses: actions/checkout@v4
           - uses: actions/setup-python@v4
             with:
                 python-version: ${{matrix.python}}
           - run: pip install pytest
           - run: pytest -v
        strategy:
            matrix:
                python: ["3.11","3.12"]   
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
            - run: pip install ruff
            - run: ruff check .
    
    db-check:
        runs-on: ubuntu-latest
        needs: [lint, test]
        services:
            db:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: test
                ports:
                    - 5432:5432
                options: ->
                      --health-cmd pg_isready
                      --health-interval 5s
                      --health-timeout 5s
                      --health-retries 5    

        steps:
            - uses: actions/checkout@v4
            - run: psql -h localhost -U postgres -c  "SELECT 1"
              env:
                  PGPASSWORD: test