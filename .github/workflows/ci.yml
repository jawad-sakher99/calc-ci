name: CI
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
           - uses: actions/checkout@v4
           - uses: actions/setup-python@v4
             with:
                 python-version: ${{matrix.python}}
           - run: pip install pytest
           - run: pytest -v
        strategy:
            matrix:
                python: ["3.11","3.12"]   
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
            - run: pip install ruff
            - run: ruff check .
                  